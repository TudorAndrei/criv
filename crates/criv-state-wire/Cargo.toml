[package]
name = "criv-state-wire"
version = "0.14.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Shared published State wire grammar for criv"
repository = "https://github.com/TudorAndrei/criv"
publish = false

[lints]
workspace = true

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"
