[package]
name = "criv-state-wire"
version = "0.13.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Shared serialized State document for criv"
repository = "https://github.com/TudorAndrei/criv"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"
