[package]
name = "criv-wasm"
version = "0.9.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "WASM helpers for the criv Obsidian plugin"
repository = "https://github.com/TudorAndrei/criv"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
criv-state-wire = { version = "0.9.0", path = "../criv-state-wire" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
