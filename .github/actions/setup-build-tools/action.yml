name: Set up cached build tools
description: Cache mise-managed tool installations and Cargo downloads
inputs:
  tools:
    description: Optional mise install arguments; empty installs the repository tool set
    default: ""
  cargo-cache:
    description: Restore Cargo registry and Git downloads
    default: "true"
  save-cargo-cache:
    description: Own Cargo download publication for this operating system on main
    default: "false"
  save-tool-cache:
    description: Own mise tool cache publication for this tool set and platform on main
    default: "false"
runs:
  using: composite
  steps:
    - name: Configure cached toolchain homes
      shell: bash
      env:
        SETUP_ACTION_PATH: ${{ github.action_path }}
      run: |
        action_path="$SETUP_ACTION_PATH"
        if [ "$RUNNER_OS" = Windows ]; then
          action_path="$(cygpath -u "$action_path")"
        fi
        bash "$action_path/configure-env.sh"

    - name: Cache Cargo downloads on main
      if: >-
        inputs.cargo-cache == 'true' && inputs.save-cargo-cache == 'true' &&
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.CARGO_HOME }}/git/db
          ${{ env.CARGO_HOME }}/registry/cache
          ${{ env.CARGO_HOME }}/registry/index
        key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-inputs-${{ runner.os }}-

    - name: Restore Cargo downloads
      if: >-
        inputs.cargo-cache == 'true' && !(
          inputs.save-cargo-cache == 'true' && github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        )
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.CARGO_HOME }}/git/db
          ${{ env.CARGO_HOME }}/registry/cache
          ${{ env.CARGO_HOME }}/registry/index
        key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-inputs-${{ runner.os }}-

    - name: Install and cache mise tools
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        install: true
        install_args: ${{ inputs.tools }}
        cache: true
        cache_key_prefix: criv-tools-v1
        # One job per tool set and platform saves, so parallel jobs do not
        # race to reserve the same key.
        cache_save: >-
          ${{ inputs.save-tool-cache == 'true' && github.event_name == 'push' &&
              github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
