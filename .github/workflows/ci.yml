name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set criv base ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CRIV_BASE_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "CRIV_BASE_REF=${{ github.event.before }}" >> "$GITHUB_ENV"
          else
            echo "Unable to determine CRIV_BASE_REF for ${{ github.event_name }}" >&2
            exit 1
          fi

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('.obsidian/plugins/criv/package-lock.json', 'extensions/vscode-criv/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: rustup component add clippy rustfmt --toolchain 1.97.1

      - name: Install plugin dependencies
        run: npm --prefix .obsidian/plugins/criv ci

      - name: Install VS Code extension dependencies
        run: npm --prefix extensions/vscode-criv ci

      - name: Run repository checks
        run: xvfb-run -a mise run check

  windows:
    name: Windows build and tests
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Build
        run: cargo +1.97.1 build --workspace

      - name: Test
        run: cargo +1.97.1 test --workspace
