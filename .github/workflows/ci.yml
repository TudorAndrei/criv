name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    outputs:
      performance: ${{ steps.classify.outputs.performance }}
      site: ${{ steps.classify.outputs.site }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          site=false
          performance=false
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$zero" ] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            site=true
            performance=true
          else
            while IFS= read -r path; do
              case "$path" in
                docs/*|site/*|scripts/prepare-docs-site.mjs|package.json|package-lock.json|mise.toml|mise.lock|.github/workflows/ci.yml|.github/workflows/pages.yml)
                  site=true
                  ;;
              esac
              case "$path" in
                Cargo.toml|Cargo.lock|crates/criv-state-wire/*|scripts/measure-performance.sh|scripts/package-release-assets.sh|scripts/release-auto.sh|scripts/performance/*|tests/hosted_release_scripts.sh|tests/performance_*|tests/fixtures/performance/*|fixtures/performance/*|.github/workflows/ci.yml|.github/workflows/discovery-*.yml|.github/workflows/performance-notes.yml|.github/workflows/release.yml)
                  performance=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "performance=$performance" >> "$GITHUB_OUTPUT"

  core:
    name: Core repository checks
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
      HK_TIMING_JSON: hk-timing.json
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set criv base ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CRIV_BASE_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "CRIV_BASE_REF=${{ github.event.before }}" >> "$GITHUB_ENV"
          else
            echo "Unable to determine CRIV_BASE_REF for ${{ github.event_name }}" >&2
            exit 1
          fi

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: rustup component add clippy rustfmt --toolchain 1.97.1

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Run core repository checks
        run: hk check --all

      - name: Upload hk timing report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hk-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HK_TIMING_JSON }}
          if-no-files-found: warn
          retention-days: 14

  wasm:
    name: Wasm build
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Build Wasm helper
        run: npm --prefix .obsidian/plugins/criv run build:wasm

  editor-contracts:
    name: Shared editor contracts
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check shared editor contracts
        run: npm run check:editor-contracts

  obsidian:
    name: Obsidian companion
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --workspace criv-obsidian-plugin --audit-level=high

      - name: Check formatting
        run: npm --prefix .obsidian/plugins/criv run format:check

      - name: Lint
        run: npm --prefix .obsidian/plugins/criv run lint

      - name: Test
        run: npm --prefix .obsidian/plugins/criv test

      - name: Build plugin
        run: npm --prefix .obsidian/plugins/criv run build:plugin

  vscode:
    name: VS Code companion
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --workspace vscode-criv --audit-level=high

      - name: Check formatting
        run: npm --prefix extensions/vscode-criv run format:check

      - name: Lint
        run: npm --prefix extensions/vscode-criv run lint

      - name: Test
        run: npm --prefix extensions/vscode-criv test

      - name: Run extension-host integration tests
        run: xvfb-run -a npm --prefix extensions/vscode-criv run test:integration

  site:
    name: Site build
    needs: changes
    runs-on: ubuntu-24.04

    steps:
      - name: Skip site build for unrelated changes
        if: needs.changes.outputs.site != 'true'
        run: echo "No site input changed."

      - name: Checkout
        if: needs.changes.outputs.site == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install mise tools
        if: needs.changes.outputs.site == 'true'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install JavaScript dependencies
        if: needs.changes.outputs.site == 'true'
        run: npm ci --ignore-scripts

      - name: Build site
        if: needs.changes.outputs.site == 'true'
        run: npm run build:site

  performance-smoke:
    name: Performance tooling smoke tests
    needs: changes
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Skip performance smoke tests for unrelated changes
        if: needs.changes.outputs.performance != 'true'
        run: echo "No performance tooling input changed."

      - name: Checkout
        if: needs.changes.outputs.performance == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        if: needs.changes.outputs.performance == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        if: needs.changes.outputs.performance == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install mise tools
        if: needs.changes.outputs.performance == 'true'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Test performance tooling
        if: needs.changes.outputs.performance == 'true'
        run: |
          bash tests/performance_harness.sh
          bash tests/performance_elixir_workloads.sh
          bash tests/performance_git_note.sh
          bash tests/hosted_release_scripts.sh
          node --test scripts/performance/measure-state-wasm.test.mjs

  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    needs:
      - changes
      - core
      - discovery-contracts
      - editor-contracts
      - wasm
      - obsidian
      - performance-smoke
      - site
      - vscode
      - windows
      - macos-watch-lock
    if: ${{ always() }}

    steps:
      - name: Require all lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CORE_RESULT: ${{ needs.core.result }}
          DISCOVERY_CONTRACTS_RESULT: ${{ needs.discovery-contracts.result }}
          EDITOR_CONTRACTS_RESULT: ${{ needs.editor-contracts.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          OBSIDIAN_RESULT: ${{ needs.obsidian.result }}
          PERFORMANCE_SMOKE_RESULT: ${{ needs.performance-smoke.result }}
          SITE_RESULT: ${{ needs.site.result }}
          VSCODE_RESULT: ${{ needs.vscode.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_WATCH_LOCK_RESULT: ${{ needs.macos-watch-lock.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$CORE_RESULT" = success
          test "$DISCOVERY_CONTRACTS_RESULT" = success
          test "$EDITOR_CONTRACTS_RESULT" = success
          test "$WASM_RESULT" = success
          test "$OBSIDIAN_RESULT" = success
          test "$PERFORMANCE_SMOKE_RESULT" = success
          test "$SITE_RESULT" = success
          test "$VSCODE_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$MACOS_WATCH_LOCK_RESULT" = success

  discovery-contracts:
    name: Discovery contracts (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS ARM64
            runner: macos-15
          - name: Windows x86_64
            runner: windows-2025
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Run shared discovery contract corpus
        run: "cargo +1.97.1 test --locked --lib discovery::tests::"

  windows:
    name: Windows build and tests
    runs-on: windows-2025
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Build
        run: cargo +1.97.1 build --locked --workspace

      - name: Test
        run: cargo +1.97.1 test --locked --workspace

  macos-watch-lock:
    name: macOS watch lock tests
    runs-on: macos-15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Test watch lock
        run: |
          cargo +1.97.1 test --locked --lib watch::tests::
          cargo +1.97.1 test --locked --test cli_workflows watch_once
          cargo +1.97.1 test --locked --test cli_workflows long_running_watch_takes_lock_before_startup_rebuild
