name: CI

on:
  pull_request:
    paths-ignore:
      - site/**
  push:
    branches:
      - main
    paths-ignore:
      - site/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core repository checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set criv base ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CRIV_BASE_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "CRIV_BASE_REF=${{ github.event.before }}" >> "$GITHUB_ENV"
          else
            echo "Unable to determine CRIV_BASE_REF for ${{ github.event_name }}" >&2
            exit 1
          fi

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-core-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-core-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: rustup component add clippy rustfmt --toolchain 1.97.1

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Emit criv annotations
        continue-on-error: true
        run: cargo run --quiet -- check --format github

      - name: Run core repository checks
        run: hk check --all

  wasm:
    name: Wasm build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-wasm-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Build Wasm helper
        run: npm --prefix .obsidian/plugins/criv run build:wasm

  obsidian:
    name: Obsidian companion
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-obsidian-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-obsidian-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --workspace criv-obsidian-plugin --audit-level=high

      - name: Check formatting
        run: npm --prefix .obsidian/plugins/criv run format:check

      - name: Lint
        run: npm --prefix .obsidian/plugins/criv run lint

      - name: Test
        run: npm --prefix .obsidian/plugins/criv test

      - name: Build plugin
        run: npm --prefix .obsidian/plugins/criv run build:plugin

  vscode:
    name: VS Code companion
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-vscode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-vscode-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --workspace vscode-criv --audit-level=high

      - name: Check formatting
        run: npm --prefix extensions/vscode-criv run format:check

      - name: Lint
        run: npm --prefix extensions/vscode-criv run lint

      - name: Test
        run: npm --prefix extensions/vscode-criv test

      - name: Run extension-host integration tests
        run: xvfb-run -a npm --prefix extensions/vscode-criv run test:integration

  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    needs:
      - core
      - wasm
      - obsidian
      - vscode
    if: ${{ always() }}

    steps:
      - name: Require all Linux lanes
        env:
          CORE_RESULT: ${{ needs.core.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          OBSIDIAN_RESULT: ${{ needs.obsidian.result }}
          VSCODE_RESULT: ${{ needs.vscode.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$WASM_RESULT" = success
          test "$OBSIDIAN_RESULT" = success
          test "$VSCODE_RESULT" = success

  windows:
    name: Windows build and tests
    runs-on: windows-2025
    # Reports without blocking until the Windows support policy in #30 lands.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Build
        run: cargo +1.97.1 build --workspace

      - name: Test
        run: cargo +1.97.1 test --workspace
