name: Performance notes

on:
  push:
    paths-ignore:
      - site/**
      - docs/**
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  measure-and-publish:
    name: Measure and publish performance evidence
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-inputs-${{ runner.os }}-

      - name: Install Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build release binaries
        run: cargo build --locked --release --package criv --package criv-perf-harness

      - name: Measure canonical workloads
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          target/release/criv-perf-harness \
            --repository-root . \
            --binary target/release/criv \
            --profile release \
            --samples 5 \
            --results-root performance-results

      - name: Render performance note and report
        env:
          ARTIFACT_NAME: performance-${{ github.sha }}-${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
          PUSHED_REF: ${{ github.ref }}
          WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          result_dir="$(find performance-results -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$result_dir"
          scripts/performance/render-git-note.sh \
            "$result_dir" \
            performance-results/performance-note.json \
            "$COMMIT" \
            "$PUSHED_REF" \
            "$WORKFLOW_URL" \
            "$WORKFLOW_RUN_ID" \
            "$WORKFLOW_ATTEMPT" \
            "$ARTIFACT_NAME"
          target/release/criv-perf-report \
            --result-dir "$result_dir" \
            --note performance-results/performance-note.json \
            --output performance-results/report.html \
            --github-summary performance-results/report-summary.md

      - name: Upload performance report and raw evidence
        id: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: performance-results
          if-no-files-found: warn
          retention-days: 30

      - name: Publish workflow summary
        if: ${{ success() }}
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        shell: bash
        run: |
          cat performance-results/report-summary.md >>"$GITHUB_STEP_SUMMARY"
          printf '\n[Download the HTML report and raw evidence](%s)\n' \
            "$ARTIFACT_URL" >>"$GITHUB_STEP_SUMMARY"

      - name: Publish performance note
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          scripts/performance/publish-git-note.sh \
            performance-results/performance-note.json \
            "${{ github.sha }}" \
            origin
