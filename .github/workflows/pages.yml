name: Pages

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - docs/**
      - package.json
      - package-lock.json
      - scripts/prepare-docs-site.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Prepare documentation site
        run: node scripts/prepare-docs-site.mjs

      - name: Build C4 explorer
        run: node_modules/.bin/likec4 build --output site/architecture --base /criv/architecture/ --use-hash-history docs/architecture

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: false
          cache: true

      - name: Build documentation
        run: mise x cargo:mdbook@latest -- mdbook build .site-build/docs-book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
