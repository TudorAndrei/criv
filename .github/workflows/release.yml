name: Automatic release

on: # zizmor: ignore[dangerous-triggers] Only a successful push CI run from this repository can pass the prepare job condition.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit:
        description: Full prepared release commit ID
        required: true
        type: string
      tag:
        description: Prepared root release tag, for example v0.10.0
        required: true
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  prepare:
    name: Select or prepare release
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.release }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install release tools
        if: github.event_name != 'workflow_dispatch'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Configure release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Select prepared manual release
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "${#EXPECTED_COMMIT}" = 40
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          version="${RELEASE_TAG#v}"
          actual_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "criv") | .version')"
          test "$actual_version" = "$version"
          test "$(git log -1 --format=%s)" = "chore(release): $RELEASE_TAG"
          {
            echo "release=true"
            echo "commit=$EXPECTED_COMMIT"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

      - name: Prepare automatic release
        id: automatic
        if: github.event_name != 'workflow_dispatch'
        env:
          EXPECTED_CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-auto.sh "$EXPECTED_CI_COMMIT"

      - name: Export release selection
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE: ${{ steps.manual.outputs.release }}
          MANUAL_COMMIT: ${{ steps.manual.outputs.commit }}
          MANUAL_TAG: ${{ steps.manual.outputs.tag }}
          MANUAL_VERSION: ${{ steps.manual.outputs.version }}
          AUTO_RELEASE: ${{ steps.automatic.outputs.release }}
          AUTO_COMMIT: ${{ steps.automatic.outputs.commit }}
          AUTO_TAG: ${{ steps.automatic.outputs.tag }}
          AUTO_VERSION: ${{ steps.automatic.outputs.version }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            {
              echo "release=$MANUAL_RELEASE"
              echo "commit=$MANUAL_COMMIT"
              echo "tag=$MANUAL_TAG"
              echo "version=$MANUAL_VERSION"
            } >>"$GITHUB_OUTPUT"
          else
            {
              echo "release=$AUTO_RELEASE"
              echo "commit=$AUTO_COMMIT"
              echo "tag=$AUTO_TAG"
              echo "version=$AUTO_VERSION"
            } >>"$GITHUB_OUTPUT"
          fi

  quality:
    name: Check exact release commit
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install release tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup component add clippy rustfmt --toolchain 1.97.1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run repository checks
        env:
          CRIV_BASE_REF: ${{ github.event.workflow_run.head_sha || needs.prepare.outputs.commit }}
        run: hk check --all

      - name: Check shared editor contracts
        run: npm run check:editor-contracts

      - name: Check Obsidian companion
        run: |
          npm audit --workspace criv-obsidian-plugin --audit-level=high
          npm --prefix .obsidian/plugins/criv run format:check
          npm --prefix .obsidian/plugins/criv run lint
          npm --prefix .obsidian/plugins/criv test
          npm --prefix .obsidian/plugins/criv run build:plugin

      - name: Check VS Code companion
        run: |
          npm audit --workspace vscode-criv --audit-level=high
          npm --prefix extensions/vscode-criv run format:check
          npm --prefix extensions/vscode-criv run lint
          npm --prefix extensions/vscode-criv test
          xvfb-run -a npm --prefix extensions/vscode-criv run test:integration

      - name: Package VS Code companion
        run: npm --prefix extensions/vscode-criv run package

      - name: Upload exact VS Code package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-vsix-${{ needs.prepare.outputs.commit }}
          path: extensions/vscode-criv/vscode-criv.vsix
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable_suffix: ""
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Cache Cargo registry inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: release-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-build-${{ matrix.target }}-

      - name: Build exact release binary
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          cargo build --locked --release --target "$RELEASE_TARGET" --package criv --bin criv
          mkdir -p target/release-build
          cp "target/$RELEASE_TARGET/release/criv$EXECUTABLE_SUFFIX" \
            "target/release-build/criv$EXECUTABLE_SUFFIX"
          test "$("target/release-build/criv$EXECUTABLE_SUFFIX" --version)" = "criv $RELEASE_VERSION"

      - name: Upload exact release binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-binary-${{ matrix.target }}-${{ needs.prepare.outputs.commit }}
          path: target/release-build/criv${{ matrix.executable_suffix }}
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package release
    needs:
      - prepare
      - quality
      - build
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout current release tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact release binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-binary-*-${{ needs.prepare.outputs.commit }}
          path: downloaded-binaries

      - name: Download exact VS Code package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-vsix-${{ needs.prepare.outputs.commit }}
          path: release-vsix

      - name: Arrange exact release binaries
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          mkdir -p bundle
          for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
            suffix=""
            if [ "$target" = x86_64-pc-windows-msvc ]; then
              suffix=".exe"
            fi
            source="downloaded-binaries/release-binary-$target-$COMMIT/criv$suffix"
            test -f "$source"
            mkdir -p "bundle/$target"
            mv "$source" "bundle/$target/criv$suffix"
          done

      - name: Package exact release binaries
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          scripts/package-release-assets.sh \
            bundle release-vsix/vscode-criv.vsix \
            "$VERSION" "$COMMIT" dist

      - name: Upload release candidate assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-candidate-${{ needs.prepare.outputs.commit }}
          path: dist
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Verify ${{ matrix.target }} archive
    needs:
      - prepare
      - package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: criv-x86_64-unknown-linux-gnu.tar.gz
            binary: criv
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: criv-aarch64-unknown-linux-gnu.tar.gz
            binary: criv
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: criv-aarch64-apple-darwin.tar.gz
            binary: criv
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: criv-x86_64-pc-windows-msvc.zip
            binary: criv.exe

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate-${{ needs.prepare.outputs.commit }}
          path: dist

      - name: Verify Unix archive
        if: runner.os != 'Windows'
        env:
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          (cd dist && shasum -a 256 --check SHA256SUMS.txt)
          mkdir extracted
          tar -C extracted -xzf "dist/$RELEASE_ARCHIVE"
          expected="$(jq -r --arg target "$RELEASE_TARGET" '.artifacts[] | select(.target == $target) | .sha256' dist/release-manifest.json)"
          actual="$(shasum -a 256 "extracted/$RELEASE_BINARY" | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$("extracted/$RELEASE_BINARY" --version)" = "criv $RELEASE_VERSION"
          binary="$(pwd)/extracted/$RELEASE_BINARY"
          "$binary" watch --once
          mkdir "$RUNNER_TEMP/no-git"
          env PATH="$RUNNER_TEMP/no-git" "$binary" query diff latest latest

      - name: Verify Windows archive
        if: runner.os == 'Windows'
        env:
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $digest, $name = $line -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path dist $name)).Hash.ToLowerInvariant()
            if ($actual -ne $digest) { throw "checksum mismatch: $name" }
          }
          Expand-Archive -Path "dist/$env:RELEASE_ARCHIVE" -DestinationPath extracted
          $manifest = Get-Content dist/release-manifest.json | ConvertFrom-Json
          $expected = ($manifest.artifacts | Where-Object target -eq $env:RELEASE_TARGET).sha256
          $binary = "extracted/$env:RELEASE_BINARY"
          $actual = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "release binary digest mismatch" }
          if ((& $binary --version) -ne "criv $env:RELEASE_VERSION") { throw "release version mismatch" }
          $binary = (Resolve-Path $binary).Path
          & $binary watch --once
          if ($LASTEXITCODE -ne 0) { throw "release publication smoke test failed" }
          $oldPath = $env:PATH
          $emptyPath = Join-Path $env:RUNNER_TEMP "no-git"
          New-Item -ItemType Directory -Force -Path $emptyPath | Out-Null
          $env:PATH = $emptyPath
          try {
            & $binary query diff latest latest
            if ($LASTEXITCODE -ne 0) { throw "PATH-without-Git smoke test failed" }
          } finally { $env:PATH = $oldPath }

  publish:
    name: Publish verified release
    needs:
      - prepare
      - verify
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure tag publication credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Download verified release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate-${{ needs.prepare.outputs.commit }}
          path: dist

      - name: Create or validate release tags
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          wasm_tag="criv-wasm-$RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin
          for tag in "$RELEASE_TAG" "$wasm_tag"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              test "$(git rev-list -n 1 "$tag")" = "$COMMIT"
            else
              git tag "$tag" "$COMMIT"
            fi
          done
          git push --atomic origin "refs/tags/$RELEASE_TAG" "refs/tags/$wasm_tag"

      - name: Create or update draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false ]; then
              echo "published=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          echo "published=false" >>"$GITHUB_OUTPUT"

      - name: Attest release assets
        if: steps.draft.outputs.published != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/criv-*.tar.gz
            dist/criv-*.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json

      - name: Verify and publish draft
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          expected='["SHA256SUMS.txt","criv-aarch64-apple-darwin.tar.gz","criv-aarch64-unknown-linux-gnu.tar.gz","criv-x86_64-pc-windows-msvc.zip","criv-x86_64-unknown-linux-gnu.tar.gz","release-manifest.json"]'
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort')"
          test "$actual" = "$expected"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
