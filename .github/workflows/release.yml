name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_name: criv
            archive_ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: criv
            archive_ext: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            binary_name: criv
            archive_ext: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary_name: criv.exe
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin criv

      - name: Smoke test version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          actual="$("$binary" --version | awk '{print $2}')"
          if [ "$actual" != "$expected" ]; then
            echo "expected criv version $expected, got $actual" >&2
            exit 1
          fi

      - name: Smoke test version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          $binary = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          $actual = (& $binary --version).Split(" ")[1]
          if ($actual -ne $expected) {
            throw "expected criv version $expected, got $actual"
          }

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="criv-${{ matrix.target }}.${{ matrix.archive_ext }}"
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/stage/${{ matrix.binary_name }}"
          chmod +x "dist/stage/${{ matrix.binary_name }}"
          tar -C dist/stage -czf "dist/$archive" "${{ matrix.binary_name }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "criv-${{ matrix.target }}.${{ matrix.archive_ext }}"
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/stage/${{ matrix.binary_name }}"
          Compress-Archive -Path "dist/stage/${{ matrix.binary_name }}" -DestinationPath "dist/$archive" -Force

      - name: Upload packaged binary
        uses: actions/upload-artifact@v6
        with:
          name: criv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v5
        with:
          pattern: criv-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum criv-* > SHA256SUMS.txt

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: |
            dist/criv-*
            dist/SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "criv $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
