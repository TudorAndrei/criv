name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Verify measured release gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and validate release-gate receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          git fetch origin refs/notes/criv-release-gates:refs/notes/criv-release-gates
          commit="$(git rev-parse HEAD)"
          git notes --ref=criv-release-gates show "$commit" > release-gate.json
          now="$(date +%s)"
          jq -e --arg commit "$commit" --argjson now "$now" '
            .schema == "criv.discovery-release-gate.v1" and
            .passed == true and
            .commit == $commit and
            .valid_until_unix >= $now and
            (.artifact_run_id | type == "number" and . > 0) and
            (.artifacts | length == 4)
          ' release-gate.json >/dev/null

          mkdir -p measured
          run_id="$(jq -r .artifact_run_id release-gate.json)"
          while IFS=$'\t' read -r target artifact_name file_name sha256; do
            download="download/$target"
            gh run download "$run_id" --name "$artifact_name" --dir "$download"
            file="$(find "$download" -type f -path "*/$target/$file_name" -print -quit)"
            test -n "$file"
            printf '%s  %s\n' "$sha256" "$file" | sha256sum --check --strict
            binary_name=criv
            if [[ "$target" == "x86_64-pc-windows-msvc" ]]; then
              binary_name=criv.exe
            fi
            mkdir -p "measured/$target"
            cp "$file" "measured/$target/$binary_name"
          done < <(jq -r '.artifacts[] | [.target, .artifact_name, .file_name, .sha256] | @tsv' release-gate.json)

      - name: Upload verified measured binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: measured-criv-binaries
          path: measured
          if-no-files-found: error
          retention-days: 7

  viewer:
    name: Package editor viewer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Package viewer
        run: npm --prefix extensions/vscode-criv run package

      - name: Upload viewer package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: editor-viewer
          path: extensions/vscode-criv/vscode-criv.vsix
          if-no-files-found: error
          retention-days: 7

  build:
    name: Package measured ${{ matrix.target }}
    needs:
      - gate
      - viewer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_name: criv
            archive_ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: criv
            archive_ext: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            binary_name: criv
            archive_ext: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary_name: criv.exe
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download viewer package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: editor-viewer
          path: viewer-package

      - name: Download measured binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: measured-criv-binaries
          path: measured

      - name: Select measured binary
        shell: bash
        run: |
          mkdir -p "target/${{ matrix.target }}/release"
          cp "measured/${{ matrix.target }}/${{ matrix.binary_name }}" \
            "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          fi

      - name: Smoke test version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          actual="$("$binary" --version | awk '{print $2}')"
          if [ "$actual" != "$expected" ]; then
            echo "expected criv version $expected, got $actual" >&2
            exit 1
          fi

      - name: Smoke test version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          $binary = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          $actual = (& $binary --version).Split(" ")[1]
          if ($actual -ne $expected) {
            throw "expected criv version $expected, got $actual"
          }

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="criv-${{ matrix.target }}.${{ matrix.archive_ext }}"
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/stage/${{ matrix.binary_name }}"
          cp "viewer-package/vscode-criv.vsix" "dist/stage/vscode-criv.vsix"
          chmod +x "dist/stage/${{ matrix.binary_name }}"
          tar -C dist/stage -czf "dist/$archive" "${{ matrix.binary_name }}" vscode-criv.vsix

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "criv-${{ matrix.target }}.${{ matrix.archive_ext }}"
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/stage/${{ matrix.binary_name }}"
          Copy-Item "viewer-package/vscode-criv.vsix" "dist/stage/vscode-criv.vsix"
          Compress-Archive -Path "dist/stage/${{ matrix.binary_name }}", "dist/stage/vscode-criv.vsix" -DestinationPath "dist/$archive" -Force

      - name: Upload packaged binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: criv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag is reachable from main
        shell: bash
        run: |
          git fetch --force origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $tag_commit, which is not reachable from origin/main" >&2
            exit 1
          fi

      - name: Download packaged binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: criv-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum criv-*.tar.gz criv-*.zip > SHA256SUMS.txt

      - name: Attest release assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/criv-*.tar.gz
            dist/criv-*.zip
            dist/SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "criv $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt --clobber
