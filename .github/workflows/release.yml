name: Verify release assets

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }} release asset
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: criv-x86_64-unknown-linux-gnu.tar.gz
            binary: criv
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: criv-aarch64-unknown-linux-gnu.tar.gz
            binary: criv
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: criv-aarch64-apple-darwin.tar.gz
            binary: criv
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: criv-x86_64-pc-windows-msvc.zip
            binary: criv.exe

    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and validate release-gate receipt
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          git fetch origin refs/notes/criv-release-gates:refs/notes/criv-release-gates
          commit="$(git rev-parse HEAD)"
          git notes --ref=criv-release-gates show "$commit" > release-gate.json
          now="$(date +%s)"
          jq -e --arg commit "$commit" --argjson now "$now" '
            .schema == "criv.discovery-release-gate.v1" and
            .passed == true and
            .commit == $commit and
            .valid_until_unix >= $now and
            (.artifacts | length == 4)
          ' release-gate.json >/dev/null
          test "$RELEASE_TAG" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "criv") | .version')"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist

      - name: Verify archive checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          shasum -a 256 --check SHA256SUMS.txt

      - name: Verify archive checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $digest, $name = $line -split '\s+', 2
            $path = Join-Path dist $name
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $digest) {
              throw "release asset checksum mismatch: $name"
            }
          }

      - name: Extract and verify Unix binary
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mkdir -p extracted
          tar -C extracted -xzf "dist/$RELEASE_ARCHIVE"
          expected_digest="$(jq -r --arg target "$RELEASE_TARGET" '.artifacts[] | select(.target == $target) | .sha256' release-gate.json)"
          actual_digest="$(shasum -a 256 "extracted/$RELEASE_BINARY" | awk '{print $1}')"
          test "$actual_digest" = "$expected_digest"
          expected_version="${RELEASE_TAG#v}"
          actual_version="$("extracted/$RELEASE_BINARY" --version | awk '{print $2}')"
          test "$actual_version" = "$expected_version"

      - name: Extract and verify Windows binary
        if: runner.os == 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          Expand-Archive -Path "dist/$env:RELEASE_ARCHIVE" -DestinationPath extracted
          $receipt = Get-Content release-gate.json | ConvertFrom-Json
          $expectedDigest = ($receipt.artifacts | Where-Object target -eq $env:RELEASE_TARGET).sha256
          $binary = "extracted/$env:RELEASE_BINARY"
          $actualDigest = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "accepted binary digest mismatch"
          }
          $expectedVersion = $env:RELEASE_TAG.TrimStart("v")
          $actualVersion = (& $binary --version).Split(" ")[1]
          if ($actualVersion -ne $expectedVersion) {
            throw "expected criv version $expectedVersion, got $actualVersion"
          }

  attest:
    name: Attest verified release assets
    if: startsWith(github.event.release.tag_name, 'v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist

      - name: Attest release assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/criv-*.tar.gz
            dist/criv-*.zip
            dist/SHA256SUMS.txt
