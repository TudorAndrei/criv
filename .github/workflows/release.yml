name: Automatic release

on: # zizmor: ignore[dangerous-triggers] Only a successful push CI run from this repository can pass the prepare job condition.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit:
        description: Full prepared release commit ID
        required: true
        type: string
      tag:
        description: Prepared root release tag, for example v0.10.0
        required: true
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  prepare:
    name: Select or prepare release
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.release }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install release tools
        if: github.event_name != 'workflow_dispatch'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Configure release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Select prepared manual release
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "${#EXPECTED_COMMIT}" = 40
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          version="${RELEASE_TAG#v}"
          actual_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "criv") | .version')"
          test "$actual_version" = "$version"
          test "$(git log -1 --format=%s)" = "chore(release): $RELEASE_TAG"
          {
            echo "release=true"
            echo "commit=$EXPECTED_COMMIT"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

      - name: Prepare automatic release
        id: automatic
        if: github.event_name != 'workflow_dispatch'
        env:
          EXPECTED_CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-auto.sh "$EXPECTED_CI_COMMIT"

      - name: Export release selection
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE: ${{ steps.manual.outputs.release }}
          MANUAL_COMMIT: ${{ steps.manual.outputs.commit }}
          MANUAL_TAG: ${{ steps.manual.outputs.tag }}
          MANUAL_VERSION: ${{ steps.manual.outputs.version }}
          AUTO_RELEASE: ${{ steps.automatic.outputs.release }}
          AUTO_COMMIT: ${{ steps.automatic.outputs.commit }}
          AUTO_TAG: ${{ steps.automatic.outputs.tag }}
          AUTO_VERSION: ${{ steps.automatic.outputs.version }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            {
              echo "release=$MANUAL_RELEASE"
              echo "commit=$MANUAL_COMMIT"
              echo "tag=$MANUAL_TAG"
              echo "version=$MANUAL_VERSION"
            } >>"$GITHUB_OUTPUT"
          else
            {
              echo "release=$AUTO_RELEASE"
              echo "commit=$AUTO_COMMIT"
              echo "tag=$AUTO_TAG"
              echo "version=$AUTO_VERSION"
            } >>"$GITHUB_OUTPUT"
          fi

  quality:
    name: Check exact release commit
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install release tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup component add clippy rustfmt --toolchain 1.97.1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run repository checks
        env:
          CRIV_BASE_REF: ${{ github.event.workflow_run.head_sha || needs.prepare.outputs.commit }}
        run: hk check --all

      - name: Check shared editor contracts
        run: npm run check:editor-contracts

      - name: Check Obsidian companion
        run: |
          npm audit --workspace criv-obsidian-plugin --audit-level=high
          npm --prefix .obsidian/plugins/criv run format:check
          npm --prefix .obsidian/plugins/criv run lint
          npm --prefix .obsidian/plugins/criv test
          npm --prefix .obsidian/plugins/criv run build:plugin

      - name: Check VS Code companion
        run: |
          npm audit --workspace vscode-criv --audit-level=high
          npm --prefix extensions/vscode-criv run format:check
          npm --prefix extensions/vscode-criv run lint
          npm --prefix extensions/vscode-criv test
          xvfb-run -a npm --prefix extensions/vscode-criv run test:integration

  measure:
    name: Measure ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            primary: false
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable_suffix: ""
            primary: false
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
            primary: true
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
            primary: false

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit and install Rust
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Cache Cargo registry inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: release-evidence-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-evidence-${{ matrix.target }}-

      - name: Run discovery contract corpus
        shell: bash
        run: |
          cargo +1.97.1 test --locked --lib discovery::tests::

      - name: Build evidence tools
        env:
          CARGO_TARGET_DIR: target/release-evidence/tool-target
        shell: bash
        run: |
          cargo build --locked --release -p criv-perf-harness \
            --bin criv-discovery-adapter \
            --bin criv-discovery-baseline \
            --bin criv-discovery-commands \
            --bin criv-discovery-fixtures \
            --bin criv-discovery-inventory \
            --bin criv-discovery-snapshot
          mkdir -p target/release-evidence/tools
          for tool in criv-discovery-adapter criv-discovery-baseline criv-discovery-commands criv-discovery-fixtures criv-discovery-inventory criv-discovery-snapshot; do
            cp "target/release-evidence/tool-target/release/${tool}${{ matrix.executable_suffix }}" \
              "target/release-evidence/tools/${tool}${{ matrix.executable_suffix }}"
          done
          rm -rf target/release-evidence/tool-target

      - name: Prepare v0.9.0 adapter
        shell: bash
        run: |
          mkdir -p target/release-evidence/evidence
          target/release-evidence/tools/criv-discovery-adapter${{ matrix.executable_suffix }} \
            --repository-root . \
            --revision v0.9.0 \
            --output target/release-evidence/adapter

      - name: Measure 100k Source workload
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          workload=source-100000
          root="target/release-evidence/workloads/$workload"
          evidence="target/release-evidence/evidence/scaling/$workload"
          mkdir -p "$(dirname "$root")" "$evidence"
          target/release-evidence/tools/criv-discovery-fixtures${{ matrix.executable_suffix }} \
            --manifest "fixtures/performance/discovery/$workload.toml" --output "$root"
          target/release-evidence/tools/criv-discovery-inventory${{ matrix.executable_suffix }} \
            --root "$root" --workload-id "$workload" \
            --output "$evidence/workload-inventory.json" \
            --summary-output "$evidence/workload-summary.json"
          target/release-evidence/tools/criv-discovery-baseline${{ matrix.executable_suffix }} \
            --repository-root target/release-evidence/adapter \
            --workload-root "$root" --workload-inventory "$evidence/workload-inventory.json" \
            --adapter-receipt target/release-evidence/adapter/discovery-adapter.json \
            --probe-label v0.9.0-adapter --profile source --profile source-candidates \
            --samples 5 --results-root "$evidence/baseline"
          target/release-evidence/tools/criv-discovery-baseline${{ matrix.executable_suffix }} \
            --repository-root . \
            --workload-root "$root" --workload-inventory "$evidence/workload-inventory.json" \
            --probe-label "candidate-$EXPECTED_COMMIT" \
            --profile source --profile source-candidates \
            --samples 5 --results-root "$evidence/candidate"
          rm -rf "$root"

      - name: Measure primary 250k workloads
        if: matrix.primary
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          measure_workload() {
            workload="$1"
            shift
            root="target/release-evidence/workloads/$workload"
            evidence="target/release-evidence/evidence/scaling/$workload"
            mkdir -p "$(dirname "$root")" "$evidence"
            target/release-evidence/tools/criv-discovery-fixtures \
              --manifest "fixtures/performance/discovery/$workload.toml" --output "$root"
            target/release-evidence/tools/criv-discovery-inventory \
              --root "$root" --workload-id "$workload" \
              --output "$evidence/workload-inventory.json" \
              --summary-output "$evidence/workload-summary.json"
            baseline_profiles=()
            candidate_profiles=()
            for profile in "$@"; do
              baseline_profiles+=(--profile "$profile")
              candidate_profiles+=(--profile "$profile")
            done
            target/release-evidence/tools/criv-discovery-baseline \
              --repository-root target/release-evidence/adapter \
              --workload-root "$root" --workload-inventory "$evidence/workload-inventory.json" \
              --adapter-receipt target/release-evidence/adapter/discovery-adapter.json \
              --probe-label v0.9.0-adapter "${baseline_profiles[@]}" \
              --samples 5 --results-root "$evidence/baseline"
            target/release-evidence/tools/criv-discovery-baseline \
              --repository-root . \
              --workload-root "$root" --workload-inventory "$evidence/workload-inventory.json" \
              --probe-label "candidate-$EXPECTED_COMMIT" "${candidate_profiles[@]}" \
              --samples 5 --results-root "$evidence/candidate"
            rm -rf "$root"
          }
          measure_workload source-250000 source source-candidates
          measure_workload vault-250000 vault
          measure_workload markdown-250000 markdown

      - name: Measure clean builds and stage exact binaries
        env:
          ADAPTER_ROOT: ${{ github.workspace }}/target/release-evidence/adapter
          CANDIDATE_ROOT: ${{ github.workspace }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:GITHUB_WORKSPACE "target/release-evidence/evidence/artifacts"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          if (Test-Path Env:RUSTC_WRAPPER) { Remove-Item Env:RUSTC_WRAPPER }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path ([Environment]::GetFolderPath("UserProfile")) ".cargo" }
          $registryInputsPresent = Test-Path (Join-Path $cargoHome "registry")

          function Normal-DependencyCount([string]$SourceRoot) {
            Push-Location $SourceRoot
            try {
              $lines = cargo tree --locked --workspace --edges normal --prefix none
              if ($LASTEXITCODE -ne 0) { throw "cargo tree failed" }
              return @($lines | Sort-Object -Unique).Count
            } finally { Pop-Location }
          }

          function Measure-OneCleanBuild([string]$SourceRoot, [string]$Label, [int]$Sample) {
            $targetDirectory = Join-Path $env:RUNNER_TEMP "criv-$Label-build-$Sample"
            if (Test-Path $targetDirectory) { Remove-Item -Recurse -Force $targetDirectory }
            $env:CARGO_TARGET_DIR = $targetDirectory
            Push-Location $SourceRoot
            try {
              $timer = [System.Diagnostics.Stopwatch]::StartNew()
              cargo build --locked --release --target $env:RELEASE_TARGET --package criv --bin criv
              $timer.Stop()
              if ($LASTEXITCODE -ne 0) { throw "$Label clean build $Sample failed" }
            } finally { Pop-Location }
            if ($Sample -eq 3) {
              $binary = Join-Path $targetDirectory "$($env:RELEASE_TARGET)/release/criv$($env:EXECUTABLE_SUFFIX)"
              Copy-Item $binary (Join-Path $output "$Label-criv$($env:EXECUTABLE_SUFFIX)")
            }
            Remove-Item -Recurse -Force $targetDirectory
            return $timer.Elapsed.TotalSeconds
          }

          $baselineDependencies = Normal-DependencyCount $env:ADAPTER_ROOT
          $candidateDependencies = Normal-DependencyCount $env:CANDIDATE_ROOT
          $baselineTimes = @()
          $candidateTimes = @()
          for ($sample = 1; $sample -le 3; $sample++) {
            $labels = if ($sample % 2 -eq 0) { @("candidate", "baseline") } else { @("baseline", "candidate") }
            foreach ($label in $labels) {
              if ($label -eq "baseline") {
                $baselineTimes += Measure-OneCleanBuild $env:ADAPTER_ROOT $label $sample
              } else {
                $candidateTimes += Measure-OneCleanBuild $env:CANDIDATE_ROOT $label $sample
              }
            }
          }
          $baselineBinary = Join-Path $output "baseline-criv$($env:EXECUTABLE_SUFFIX)"
          $candidateBinary = Join-Path $output "candidate-criv$($env:EXECUTABLE_SUFFIX)"
          $manifest = [ordered]@{
            schema = "criv.discovery-remote-artifact.v2"
            commit = $env:EXPECTED_COMMIT
            target = $env:RELEASE_TARGET
            baseline_revision = "v0.9.0"
            baseline_normal_dependencies = $baselineDependencies
            candidate_normal_dependencies = $candidateDependencies
            baseline_binary = [System.IO.Path]::GetFileName($baselineBinary)
            baseline_binary_bytes = (Get-Item $baselineBinary).Length
            baseline_binary_digest = (Get-FileHash -Algorithm SHA256 $baselineBinary).Hash.ToLowerInvariant()
            baseline_build_seconds = $baselineTimes
            candidate_binary = [System.IO.Path]::GetFileName($candidateBinary)
            candidate_binary_bytes = (Get-Item $candidateBinary).Length
            candidate_binary_sha256 = (Get-FileHash -Algorithm SHA256 $candidateBinary).Hash.ToLowerInvariant()
            candidate_build_seconds = $candidateTimes
            clean_builds = $true
            compiler_cache_disabled = -not [bool]$env:RUSTC_WRAPPER
            registry_inputs_present = $registryInputsPresent
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $output "artifact.json")

      - name: Measure live-watch convergence
        if: matrix.primary
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          workload=source-10000
          root="target/release-evidence/workloads/$workload"
          evidence="target/release-evidence/evidence/live"
          mkdir -p "$(dirname "$root")" "$evidence/candidate" "$RUNNER_TEMP/criv-live-samples"
          target/release-evidence/tools/criv-discovery-fixtures \
            --manifest "fixtures/performance/discovery/$workload.toml" --output "$root"
          target/release-evidence/tools/criv-discovery-inventory \
            --root "$root" --workload-id "$workload" \
            --output "$evidence/workload-inventory.json" \
            --summary-output "$evidence/workload-summary.json"
          target/release-evidence/tools/criv-discovery-commands \
            --binary target/release-evidence/evidence/artifacts/candidate-criv \
            --binary-label "candidate-$EXPECTED_COMMIT" \
            --snapshot-executable target/release-evidence/tools/criv-discovery-snapshot \
            --workload-root "$root" --workload-inventory "$evidence/workload-inventory.json" \
            --sample-root "$RUNNER_TEMP/criv-live-samples" \
            --live-mutation-directory src/generated \
            --case watch-live-ready --samples 5 \
            --minimum-free-gib 10 --maximum-snapshot-allocation-gib 5 \
            --results-root "$evidence/candidate"
          rm -rf "$root"

      - name: Record hosted evidence identity
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $identity = [ordered]@{
            schema = "criv.discovery-remote-evidence.v2"
            commit = $env:EXPECTED_COMMIT
            target = $env:RELEASE_TARGET
            run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            repository = "${{ github.repository }}"
          }
          $identity | ConvertTo-Json | Set-Content -Encoding utf8 target/release-evidence/evidence/remote.json
          Copy-Item target/release-evidence/adapter/discovery-adapter.json target/release-evidence/evidence/discovery-adapter.json

      - name: Upload raw evidence and measured binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-evidence-${{ matrix.target }}-${{ needs.prepare.outputs.commit }}
          path: target/release-evidence/evidence
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Accept evidence and package release
    needs:
      - prepare
      - quality
      - measure
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure receipt publication credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Download hosted evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-evidence-*-${{ needs.prepare.outputs.commit }}
          path: downloaded-evidence

      - name: Arrange evidence by target
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          mkdir -p bundle
          for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
            source="downloaded-evidence/release-evidence-$target-$COMMIT"
            test -d "$source"
            mv "$source" "bundle/$target"
          done

      - name: Assemble and verify release receipt
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          scripts/performance/assemble-hosted-release-gates.sh bundle "$COMMIT" bundle/gate-input.json
          cargo run --locked --release -p criv-perf-harness --bin criv-discovery-gate -- \
            --input bundle/gate-input.json --output bundle/release-gate.json
          scripts/performance/publish-release-gate-note.sh bundle/release-gate.json "$COMMIT" origin

      - name: Build VS Code package
        run: |
          npm ci
          npm --prefix extensions/vscode-criv run package

      - name: Package exact measured binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          scripts/package-release-assets.sh \
            bundle bundle/release-gate.json extensions/vscode-criv/vscode-criv.vsix \
            "$VERSION" dist

      - name: Upload complete evidence bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-evidence-bundle-${{ needs.prepare.outputs.commit }}
          path: bundle
          if-no-files-found: error
          retention-days: 90

      - name: Upload release candidate assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-candidate-${{ needs.prepare.outputs.commit }}
          path: dist
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Verify ${{ matrix.target }} archive
    needs:
      - prepare
      - aggregate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: criv-x86_64-unknown-linux-gnu.tar.gz
            binary: criv
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: criv-aarch64-unknown-linux-gnu.tar.gz
            binary: criv
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: criv-aarch64-apple-darwin.tar.gz
            binary: criv
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: criv-x86_64-pc-windows-msvc.zip
            binary: criv.exe

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate-${{ needs.prepare.outputs.commit }}
          path: dist

      - name: Verify Unix archive
        if: runner.os != 'Windows'
        env:
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          (cd dist && shasum -a 256 --check SHA256SUMS.txt)
          mkdir extracted
          tar -C extracted -xzf "dist/$RELEASE_ARCHIVE"
          expected="$(jq -r --arg target "$RELEASE_TARGET" '.artifacts[] | select(.target == $target) | .sha256' dist/release-gate.json)"
          actual="$(shasum -a 256 "extracted/$RELEASE_BINARY" | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$("extracted/$RELEASE_BINARY" --version)" = "criv $RELEASE_VERSION"
          binary="$(pwd)/extracted/$RELEASE_BINARY"
          "$binary" watch --once
          mkdir "$RUNNER_TEMP/no-git"
          env PATH="$RUNNER_TEMP/no-git" "$binary" query diff latest latest

      - name: Verify Windows archive
        if: runner.os == 'Windows'
        env:
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $digest, $name = $line -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path dist $name)).Hash.ToLowerInvariant()
            if ($actual -ne $digest) { throw "checksum mismatch: $name" }
          }
          Expand-Archive -Path "dist/$env:RELEASE_ARCHIVE" -DestinationPath extracted
          $receipt = Get-Content dist/release-gate.json | ConvertFrom-Json
          $expected = ($receipt.artifacts | Where-Object target -eq $env:RELEASE_TARGET).sha256
          $binary = "extracted/$env:RELEASE_BINARY"
          $actual = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "accepted binary digest mismatch" }
          if ((& $binary --version) -ne "criv $env:RELEASE_VERSION") { throw "release version mismatch" }
          $binary = (Resolve-Path $binary).Path
          & $binary watch --once
          if ($LASTEXITCODE -ne 0) { throw "release publication smoke test failed" }
          $oldPath = $env:PATH
          $emptyPath = Join-Path $env:RUNNER_TEMP "no-git"
          New-Item -ItemType Directory -Force -Path $emptyPath | Out-Null
          $env:PATH = $emptyPath
          try {
            & $binary query diff latest latest
            if ($LASTEXITCODE -ne 0) { throw "PATH-without-Git smoke test failed" }
          } finally { $env:PATH = $oldPath }

  publish:
    name: Publish verified release
    needs:
      - prepare
      - verify
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure tag publication credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Download verified release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate-${{ needs.prepare.outputs.commit }}
          path: dist

      - name: Create or validate release tags
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          wasm_tag="criv-wasm-$RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin
          for tag in "$RELEASE_TAG" "$wasm_tag"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              test "$(git rev-list -n 1 "$tag")" = "$COMMIT"
            else
              git tag "$tag" "$COMMIT"
            fi
          done
          git push --atomic origin "refs/tags/$RELEASE_TAG" "refs/tags/$wasm_tag"

      - name: Create or update draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false ]; then
              echo "published=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          echo "published=false" >>"$GITHUB_OUTPUT"

      - name: Attest release assets
        if: steps.draft.outputs.published != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/criv-*.tar.gz
            dist/criv-*.zip
            dist/SHA256SUMS.txt
            dist/release-gate.json

      - name: Verify and publish draft
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          expected='["SHA256SUMS.txt","criv-aarch64-apple-darwin.tar.gz","criv-aarch64-unknown-linux-gnu.tar.gz","criv-x86_64-pc-windows-msvc.zip","criv-x86_64-unknown-linux-gnu.tar.gz","release-gate.json"]'
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort')"
          test "$actual" = "$expected"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
