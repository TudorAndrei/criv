[package]
name = "criv"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Local docs-to-code knowledge graph validator and query tool"
repository = "https://github.com/TudorAndrei/criv"
homepage = "https://github.com/TudorAndrei/criv"
documentation = "https://docs.rs/criv"

[workspace]
members = [
  "crates/criv-state-wire",
  "crates/criv-wasm",
  "scripts/performance",
  "scripts/performance/state-store-prototype",
]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
ast-grep-config = "0.44.0"
ast-grep-core = "0.44.0"
ast-grep-language = { version = "0.44.0", default-features = false, features = [
  "tree-sitter-go",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
content_inspector = "0.2"
criv-state-wire = { version = "0.8.0", path = "crates/criv-state-wire" }
fff-search = "0.10.1"
git2 = { version = "0.21.0", default-features = false }
globset = "0.4"
ignore = "0.4"
libc = "0.2"
mime_guess = "2"
notify = "8"
notify-debouncer-mini = "0.7"
pulldown-cmark = "0.13"
rumdl_lib = { package = "rumdl", version = "0.2.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
toml = "1.1.2"
tree-sitter = "0.26.3"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
usage = { package = "usage-lib", version = "3.5.3", features = ["clap"] }
wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
testcontainers = { version = "0.27.3", features = ["blocking"] }
