[package]
name = "criv"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Local docs-to-code knowledge graph validator and query tool"
repository = "https://github.com/TudorAndrei/criv"
homepage = "https://github.com/TudorAndrei/criv"
documentation = "https://docs.rs/criv"

[workspace]
members = ["crates/criv-wasm"]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[features]
default = []
embeddings = ["dep:fastembed"]

[dependencies]
ast-grep-config = "0.42.2"
ast-grep-core = "0.42.2"
ast-grep-language = { version = "0.42.2", default-features = false, features = [
    "tree-sitter-go",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
content_inspector = "0.2"
fastembed = { version = "5", optional = true, default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }
fff-search = "0.7.3-nightly.ff81719"
globset = "0.4"
ignore = "0.4"
mime_guess = "2"
notify = "8"
notify-debouncer-mini = "0.7"
pulldown-cmark = "0.13"
rumdl_lib = { package = "rumdl", version = "0.1.91", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
toml = "0.9"
tree-sitter = "0.26.3"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
