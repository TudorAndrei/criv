[package]
name = "criv"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local docs-to-code knowledge graph validator and query tool"

[workspace]
members = ["crates/criv-wasm"]

[dependencies]
globset = "0.4"
ignore = "0.4"
notify = "8"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
