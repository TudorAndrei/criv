[package]
name = "criv"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local docs-to-code knowledge graph validator and query tool"

[workspace]
members = ["crates/criv-wasm"]

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
content_inspector = "0.2"
globset = "0.4"
ignore = "0.4"
mime_guess = "2"
notify = "8"
notify-debouncer-mini = "0.7"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
toml = "0.9"
