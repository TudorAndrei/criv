[package]
name = "criv-perf-harness"
version = "0.13.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny"

[dependencies]
blake3 = "1"
criv-state-wire = { version = "0.13.0", path = "../../crates/criv-state-wire" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1.2"
usage = { package = "usage-rs", version = "6" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
