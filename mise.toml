min_version = "2026.8.16"

[tools]
# Hawk's prebuilt driver requires its exact compiler; keep 1.99.1 primary.
rust = [
  { version = "1.99.1", components = [
    "clippy",
    "rustfmt",
  ], targets = [
    "wasm32-unknown-unknown",
  ] },
  { version = "1.99.0" },
]
# Put standalone npm before Node's bundled npm on PATH.
"npm:npm" = "12.2.1"
node = "26.13.0"
hk = "2.10.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
"cargo:wasm-pack" = "0.15.1"
cocogitto = "7.0.0"
"cargo:cargo-release" = "1.1.7"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"github:rust-secure-code/cargo-auditable" = "0.7.7"
"cargo:mdbook" = "0.5.4"
taplo = "0.10.0"
"github:astral-sh/hawk" = { version = "0.1.17", version_prefix = "" }
"github:jdx/mr-boxington" = "1.29.0"
vale = "3.25.1"

[env]
HK_MISE = "1"
# Hosted builds keep their existing compiler cache. Preserve local bypasses,
# including Hawk's step environment, when mise dispatches Cargo again.
MBX_DISABLE = "{% if env.CI | default(value='') != '' or env.GITHUB_ACTIONS | default(value='') != '' %}1{% else %}{{ env.MBX_DISABLE | default(value='0') }}{% endif %}"

[wrappers.cargo]
command = "mbx"

[wrappers.cargo.env]
MBX_CARGO_SHIM_MODE = "1"
# Keep Worktrunk's independent, reflink-copied target directories.
MBX_TARGET_VIEWS = "0"

[hooks]
postinstall = "hk install --mise"

[tasks.fix]
description = "Run hk fixes against modified files"
run = "hk fix"

[tasks.release-plan]
description = "Show the next SemVer version from conventional commits"
run = "cog bump --dry-run --auto"

[tasks.release-auto]
description = "Prepare a Cocogitto release commit for the hosted release workflow"
run = "bash scripts/release-auto.sh"

[tasks.perf]
description = "Measure criv performance with canonical generated workloads"
run = "bash scripts/measure-performance.sh"

[tasks.perf-container]
description = "Smoke-test the performance harness in a pinned Docker environment"
run = "cargo test --locked --manifest-path scripts/performance/container-test/Cargo.toml --test performance_container performance_harness_runs_in_pinned_container -- --ignored --nocapture"

[tasks.vscode-build]
description = "Build the VS Code-compatible companion extension"
run = "npm --prefix extensions/vscode-criv run build"

[tasks.vscode-package]
description = "Package the VS Code-compatible companion extension as a local VSIX"
run = "npm --prefix extensions/vscode-criv run package"

[tasks.vscode-install]
description = "Package the companion extension and install it into the local editor"
depends = ["vscode-package"]
run = "code --install-extension extensions/vscode-criv/vscode-criv.vsix --force"

[tasks.pre-commit]
description = "Run the hk pre-commit hook"
run = "hk run pre-commit"

[tasks.commit-msg]
description = "Run the hk commit-msg hook"
run = "hk run commit-msg"

[tasks.pre-push]
description = "Run the hk pre-push hook"
run = "hk run pre-push"
