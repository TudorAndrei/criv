[tools]
rust = "1.97.1"
node = "26.5.1"
hk = "1.45.0"
actionlint = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.24.1"
"cargo:wasm-pack" = "0.15.0"
"npm:npm" = "10.9.8"
cocogitto = "7.0.0"
"cargo:cargo-release" = "1.1.2"
"cargo:cargo-audit" = "0.22.2"
"cargo:mdbook" = "0.5.4"
taplo = "0.10.0"
"github:astral-sh/hawk" = "0.1.9"

[env]
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"

[hooks]
postinstall = "hk install --mise"

[tasks.fix]
description = "Run hk fixes against modified files"
run = "hk fix"

[tasks.release-plan]
description = "Show the next SemVer version from conventional commits"
run = "cog bump --dry-run --auto"

[tasks.release-auto]
description = "Prepare and push a release commit for controlled acceptance"
run = "bash scripts/release-auto.sh"

[tasks.release-accept]
description = "Validate a release evidence bundle on the controlled local Mac"
run = "bash scripts/performance/accept-release-gates.sh"

[tasks.release-publish]
description = "Publish accepted local assets and release tags"
run = "bash scripts/release-publish.sh"

[tasks.perf]
description = "Measure criv performance with canonical generated workloads"
run = "bash scripts/measure-performance.sh"

[tasks.perf-container]
description = "Smoke-test the performance harness in a pinned Docker environment"
run = "cargo test --locked --manifest-path scripts/performance/container-test/Cargo.toml --test performance_container performance_harness_runs_in_pinned_container -- --ignored --nocapture"

[tasks.vscode-build]
description = "Build the VS Code-compatible companion extension"
run = "npm --prefix extensions/vscode-criv run build"

[tasks.vscode-package]
description = "Package the VS Code-compatible companion extension as a local VSIX"
run = "npm --prefix extensions/vscode-criv run package"

[tasks.vscode-install]
description = "Package the companion extension and install it into the local editor"
depends = ["vscode-package"]
run = "code --install-extension extensions/vscode-criv/vscode-criv.vsix --force"

[tasks.pre-commit]
description = "Run the hk pre-commit hook"
run = "hk run pre-commit"

[tasks.commit-msg]
description = "Run the hk commit-msg hook"
run = "hk run commit-msg"

[tasks.pre-push]
description = "Run the hk pre-push hook"
run = "hk run pre-push"
