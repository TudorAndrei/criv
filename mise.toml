[tools]
rust = "1.95.0"
node = "26.3.0"
hk = "1.45.0"
actionlint = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.24.1"
"cargo:wasm-pack" = "0.14.0"
"npm:npm" = "11.16.0"
cocogitto = "7.0.0"
"cargo:cargo-release" = "1.1.2"

[env]
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"

[hooks]
postinstall = "hk install --mise"

[tasks.check]
description = "Run all hk checks against the repository"
run = "hk check --all"

[tasks.fix]
description = "Run hk fixes against modified files"
run = "hk fix"

[tasks.release-plan]
description = "Show the next SemVer version from conventional commits"
run = "cog bump --dry-run --auto"

[tasks.release-auto]
description = "Cut a tag-only release from conventional commits"
run = "bash scripts/release-auto.sh"

[tasks.perf]
description = "Measure criv local performance on this or another vault"
run = "bash scripts/measure-performance.sh"

[tasks.plugin-build]
description = "Build the Obsidian plugin bundle and WASM helper"
run = "npm --prefix .obsidian/plugins/criv run build"

[tasks.plugin-lint]
description = "Lint the Obsidian plugin source"
run = "npm --prefix .obsidian/plugins/criv run lint"

[tasks.plugin-format-check]
description = "Check Obsidian plugin formatting"
run = "npm --prefix .obsidian/plugins/criv run format:check"

[tasks.plugin-test]
description = "Run Obsidian plugin tests"
run = "npm --prefix .obsidian/plugins/criv test"

[tasks.pre-commit]
description = "Run the hk pre-commit hook"
run = "hk run pre-commit"

[tasks.commit-msg]
description = "Run the hk commit-msg hook"
run = "hk run commit-msg"

[tasks.pre-push]
description = "Run the hk pre-push hook"
run = "hk run pre-push"
