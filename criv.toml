[vault]
docs = "docs"
adr = "adr"

[source]
roots = [
  "src",
  "tests",
  "crates",
  "packages",
  "extensions",
  "scripts",
  "fixtures",
  "site",
  ".github",
  ".config",
  ".vscode",
  ".obsidian/plugins/criv",
  "assets",
  ".agents/skills",
  "Cargo.toml",
  "Cargo.lock",
  "package.json",
  "package-lock.json",
  "mise.toml",
  "mise.lock",
  "criv.toml",
  "hk.pkl",
  "hawk.toml",
  "cog.toml",
  ".taplo.toml",
  ".rumdl.toml",
  ".gitignore",
  ".worktreeinclude",
  "skills-lock.json",
  "AGENTS.md",
  "README.md",
  "LICENSE",
]
exclude = [
  "**/target/**",
  "**/node_modules/**",
  ".obsidian/plugins/criv/main.js",
  ".obsidian/plugins/criv/pkg/**",
  "extensions/vscode-criv/dist/**",
  "extensions/vscode-criv/dist-test/**",
  "extensions/vscode-criv/pkg/**",
  "extensions/vscode-criv/.vscode-test/**",
  "extensions/vscode-criv/*.vsix",
  "site/architecture/**",
  "site/docs/**",
]

[index]
source = true

[state]
keep = 20

[enforce]
stages = ["commit", "push", "ci"]
