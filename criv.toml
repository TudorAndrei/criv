[vault]
docs = "docs"
adr = "adr"

[source]
roots = [
  "src",
  "lib",
  "scripts",
  ".github/workflows",
  ".vscode",
  ".obsidian/plugins/criv",
  "crates/criv-state-wire",
  "crates/criv-wasm",
  "extensions/vscode-criv",
  "packages/criv-editor-state",
  "packages/criv-likec4",
  "package.json",
  "package-lock.json",
  ".gitignore",
  ".taplo.toml",
  "Cargo.toml",
  "cog.toml",
  "criv.toml",
  "hk.pkl",
  "hawk.toml",
  "mise.toml",
  "README.md",
  "assets/skills",
  "assets/likec4-bridge.mjs",
  ".agents/skills",
]
exclude = [
  "**/target/**",
  "**/node_modules/**",
  "node_modules/**",
  ".obsidian/plugins/criv/main.js",
  ".obsidian/plugins/criv/pkg/**",
  "extensions/vscode-criv/dist/**",
  "extensions/vscode-criv/node_modules/**",
  "extensions/vscode-criv/pkg/**",
  "extensions/vscode-criv/*.vsix",
]

[index]
source = true

[state]
keep = 20

[enforce]
stages = ["commit", "push", "ci"]
