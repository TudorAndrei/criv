[vault]
docs = "docs"
adr = "adr"

[source]
roots = [
  "src",
  "lib",
  "scripts",
  ".github/workflows",
  ".obsidian/plugins/criv",
  "crates/criv-wasm",
  ".gitignore",
  "Cargo.toml",
  "cog.toml",
  "criv.toml",
  "hk.pkl",
  "mise.toml",
  "README.md",
]
exclude = [
  "**/target/**",
  "**/node_modules/**",
  ".obsidian/plugins/criv/main.js",
  ".obsidian/plugins/criv/pkg/**",
]

[index]
source = true
embeddings = false

[architecture.code]
output = "docs/architecture/04-code.c4"
title = "Code diagram for criv"

[enforce]
stages = ["commit", "push", "ci"]
